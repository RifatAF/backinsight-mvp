name: Тренировки APK

on:
  push:
    paths:
      - "geo-counter/**"
      - ".github/workflows/geo-counter.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geo-counter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Тесты и сборка
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Имя файла
        run: cp app/build/outputs/apk/release/app-release.apk "Trenirovki-1.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Trenirovki-1.0.${{ github.run_number }}
          path: geo-counter/Trenirovki-*.apk
      - name: Релиз для скачивания с телефона
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trenirovki-v1.0.${{ github.run_number }}
          name: Тренировки 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: geo-counter/Trenirovki-*.apk
          body: |
            Откройте эту страницу на телефоне, нажмите на файл .apk и установите.
            Новая версия ставится поверх старой, данные сохраняются.

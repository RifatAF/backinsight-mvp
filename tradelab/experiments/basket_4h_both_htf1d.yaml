# Stage 3 experiment. Locked by hash in the journal at its first exp-* run.
# Needs bars: python run_pipeline.py bars 4h basket
universe: basket
timeframe: 4h
direction: both
families: all
htf: 1d                 # multi-timeframe: entries need a confirming signal on 1d bars
htf_share: 0.60          # share of strategies with such a higher-timeframe filter
seed: 11
n_strategies: 1000
combo_share: 0.30
trend_filter_share: 0.30
screen:
  min_sharpe: 0.0
  min_cagr: 0.0
  max_drawdown: 0.60
  min_trades: 6
plateau_top_k: 10
n_null_paths: 30
n_synth_b: 30

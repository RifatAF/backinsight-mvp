# Stage 4, one pre-registered hypothesis (no search): weekly MACD 12/26/9 on ETH, long only.
# Long while the MACD line of closed weekly candles is above its signal line, otherwise cash.
# Weekly candles are built from daily bars (Monday to Sunday UTC); a week's signal is known only
# after it closes and is executed at the next daily open. Full position, no volatility target.

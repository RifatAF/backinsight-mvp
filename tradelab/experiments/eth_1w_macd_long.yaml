timeframe: 1d
direction: long
families: price
htf: 1w
htf_share: 0.0
specs:
  - family: hold
    params: {}
    htf: {family: macd, params: {fast: 12, slow: 26, signal: 9}}
seed: 11
n_strategies: 1
combo_share: 0.0
trend_filter_share: 0.0
screen:
  min_sharpe: 0.0
  min_cagr: 0.0
  max_drawdown: 0.60
  min_trades: 6
plateau_top_k: 10
